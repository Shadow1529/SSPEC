<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSPEC // System Spectra Command Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Matrix Rain Background Canvas -->
    <canvas id="matrix-canvas"></canvas>

    <!-- Main Terminal Container -->
    <div id="terminal-container">
        <pre id="banner"></pre>
        <div id="output"></div>
        <div id="cli">
            <span class="prompt">guest@sspec-node:~$</span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>

    <!-- Floating Sub-Terminal Window (DevTools Telemetry & Log Stream) -->
    <div id="window-terminal">
        <div id="win-header">
            <span>SSPEC Root Sub-Terminal [Live Log Stream]</span>
        </div>
        <div class="win-body">
            <div id="win-output"></div>
            <div class="win-cli">
                <span class="win-prompt">root@sspec-window:~#</span>
                <input type="text" id="win-input" autocomplete="off" spellcheck="false">
            </div>
        </div>
    </div>

    <!-- Main Entry Point Module (Modern ES6 Architecture) -->
    <script type="module" src="src/main.js"></script>

</body>
</html>
